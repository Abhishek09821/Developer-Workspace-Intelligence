name: canary

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: canary
      POSTGRES_PASSWORD: canary
      POSTGRES_DB: canary
    ports:
      - "5433:5432"
    volumes:
      - canary_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canary -d canary"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file:
      - apps/api/.env
    environment:
      CANARY_DATABASE_URL: postgresql+asyncpg://canary:canary@postgres:5432/canary
      CANARY_DATABASE_SYNC_URL: postgresql+psycopg://canary:canary@postgres:5432/canary
      CANARY_REDIS_URL: redis://redis:6379/0
      CANARY_CELERY_BROKER_URL: redis://redis:6379/1
      CANARY_CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - canary_web_node_modules:/app/apps/web/node_modules

volumes:
  canary_postgres_data:
  canary_web_node_modules:
